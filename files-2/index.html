<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAN CUT</title>
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #14202b;
    --muted: #5b6b79;
    --line: #c9d2da;
    --accent: #0f6b6b;
    --accent-ink: #ffffff;
    --error: #a12a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 64px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  section {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 20px; margin-bottom: 20px;
  }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  input[type="file"] { max-width: 100%; }
  video { width: 100%; max-height: 360px; background: #000; border-radius: 6px; margin-top: 14px; display: none; }
  .status { margin: 10px 0 0; color: var(--muted); min-height: 1.5em; }
  .status.erro { color: var(--error); }
  progress { width: 100%; height: 8px; margin-top: 10px; display: none; }
  .tabela { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: .9rem; color: var(--muted); font-weight: 600; }
  .tempo { display: flex; gap: 6px; align-items: center; }
  .tempo input {
    width: 92px; padding: 7px 8px; font: inherit;
    border: 1px solid var(--line); border-radius: 6px;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 6px; padding: 7px 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  button.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.pequeno { padding: 5px 8px; font-size: .85rem; color: var(--muted); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #7fc4c4; outline-offset: 2px; }
  a.baixar { color: var(--accent); font-weight: 600; }
  .erro-linha { color: var(--error); font-size: .9rem; }
  .acoes { margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>DAN CUT</h1>
  <p class="sub">Envie um MP4, defina os trechos e baixe cada recorte.</p>

  <section>
    <h2>1. Vídeo</h2>
    <input id="arquivo" type="file" accept="video/mp4,.mp4">
    <progress id="progresso" max="100" value="0"></progress>
    <p id="status" class="status" role="status">Escolha um arquivo MP4 do seu computador.</p>
    <video id="player" controls></video>
  </section>

  <section>
    <h2>2. Recortes</h2>
    <p class="sub" style="margin-bottom:12px">Use mm:ss, hh:mm:ss ou segundos. “Marcar” copia a posição atual do vídeo.</p>
    <div class="tabela">
      <table>
        <thead>
          <tr><th>Recorte</th><th>Início</th><th>Fim</th><th></th><th>Vídeo</th></tr>
        </thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
    <div class="acoes"><button id="novaLinha" type="button">Adicionar recorte</button></div>
  </section>
</main>

<script src="/config.js"></script>
<script>
const API = (window.BACKEND_URL || '').replace(/\/$/, '');
const arquivo = document.getElementById('arquivo');
const player = document.getElementById('player');
const statusEl = document.getElementById('status');
const progresso = document.getElementById('progresso');
const linhas = document.getElementById('linhas');
let videoId = null;
let contador = 0;

function mostrar(msg, erro) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (erro ? ' erro' : '');
}

function lerTempo(v) {
  v = v.trim().replace(',', '.');
  if (!v) return NaN;
  const p = v.split(':').map(Number);
  if (p.length > 3 || p.some((n) => isNaN(n) || n < 0)) return NaN;
  return p.reduce((a, n) => a * 60 + n, 0);
}

function formatar(seg) {
  const h = Math.floor(seg / 3600);
  const m = Math.floor((seg % 3600) / 60);
  const s = (seg % 60).toFixed(1).replace(/\.0$/, '');
  const dois = (n) => String(n).padStart(2, '0');
  const ss = Number(s) < 10 ? '0' + s : s;
  return h ? `${h}:${dois(m)}:${ss}` : `${dois(m)}:${ss}`;
}

arquivo.addEventListener('change', () => {
  const f = arquivo.files[0];
  if (!f) return;
  videoId = null;
  player.src = URL.createObjectURL(f);
  player.style.display = 'block';

  const form = new FormData();
  form.append('video', f);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', API + '/upload');
  progresso.style.display = 'block';
  progresso.value = 0;
  mostrar('Enviando… na primeira vez o servidor pode levar cerca de 1 minuto para acordar.');
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) progresso.value = (e.loaded / e.total) * 100;
  };
  xhr.onload = () => {
    progresso.style.display = 'none';
    let dados = {};
    try { dados = JSON.parse(xhr.responseText); } catch (_) {}
    if (xhr.status === 200 && dados.id) {
      videoId = dados.id;
      mostrar('Vídeo pronto. Defina os recortes abaixo.');
    } else {
      mostrar(dados.error || 'Falha no envio do vídeo.', true);
    }
  };
  xhr.onerror = () => {
    progresso.style.display = 'none';
    mostrar('Não foi possível falar com o servidor. Tente de novo em instantes.', true);
  };
  xhr.send(form);
});

function campoTempo(placeholder) {
  const caixa = document.createElement('div');
  caixa.className = 'tempo';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = placeholder;
  input.setAttribute('aria-label', placeholder);
  const marcar = document.createElement('button');
  marcar.type = 'button';
  marcar.className = 'pequeno';
  marcar.textContent = 'Marcar';
  marcar.addEventListener('click', () => { input.value = formatar(player.currentTime || 0); });
  caixa.append(input, marcar);
  return { caixa, input };
}

function novaLinha() {
  contador += 1;
  const n = contador;
  const tr = document.createElement('tr');

  const c1 = document.createElement('td');
  c1.textContent = n;
  const c2 = document.createElement('td');
  const ini = campoTempo('00:00');
  c2.append(ini.caixa);
  const c3 = document.createElement('td');
  const fim = campoTempo('00:30');
  c3.append(fim.caixa);
  const c4 = document.createElement('td');
  const ok = document.createElement('button');
  ok.type = 'button';
  ok.className = 'primario';
  ok.textContent = 'OK';
  c4.append(ok);
  const c5 = document.createElement('td');

  ok.addEventListener('click', async () => {
    c5.textContent = '';
    if (!videoId) {
      c5.innerHTML = '<span class="erro-linha">Envie o vídeo primeiro.</span>';
      return;
    }
    const s = lerTempo(ini.input.value);
    const e = lerTempo(fim.input.value);
    if (isNaN(s) || isNaN(e) || e <= s) {
      c5.innerHTML = '<span class="erro-linha">Confira início e fim (o fim deve ser maior).</span>';
      return;
    }
    ok.disabled = true;
    ok.textContent = 'Cortando…';
    try {
      const r = await fetch(API + '/cut', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: videoId, start: s, end: e }),
      });
      if (!r.ok) {
        let msg = 'Falha ao cortar.';
        try { msg = (await r.json()).error || msg; } catch (_) {}
        if (r.status === 404) videoId = null;
        throw new Error(msg);
      }
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `recorte-${n}.mp4`;
      a.className = 'baixar';
      a.textContent = `Baixar MP4 (${(blob.size / 1048576).toFixed(1)} MB)`;
      c5.append(a);
    } catch (err) {
      const sp = document.createElement('span');
      sp.className = 'erro-linha';
      sp.textContent = err.message;
      c5.append(sp);
    } finally {
      ok.disabled = false;
      ok.textContent = 'OK';
    }
  });

  tr.append(c1, c2, c3, c4, c5);
  linhas.append(tr);
}

document.getElementById('novaLinha').addEventListener('click', novaLinha);
novaLinha();
</script>
</body>
</html>
